; PHP overrides for Mapbender 2.8 (legacy PHP 7.4 baseline)
; Mirrors what install.bash configures on Debian 11.

error_reporting = E_ERROR
display_errors = Off
log_errors = On
; Use Mapbender's own log/ dir (www-data writable via entrypoint chown)
error_log = /var/www/html/mapbender/log/php-errors.log

memory_limit = 512M
max_execution_time = 180
max_input_time = 180
post_max_size = 64M
upload_max_filesize = 64M
default_socket_timeout = 120

date.timezone = Europe/Berlin
short_open_tag = On

; Sessions (Mapbender uses default file-based sessions)
session.save_handler = files
session.save_path = "/tmp"
session.gc_maxlifetime = 7200
session.cookie_lifetime = 0
session.use_strict_mode = 1

; OPcache
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
