<VirtualHost *:80>
    ServerName  mapbender.local
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    Alias /mapbender /var/www/html/mapbender/http
    Alias /owsproxy /var/www/html/mapbender/owsproxy
    Alias /cors_proxy /var/www/html/mapbender/cors_proxy
    Alias /http_auth /var/www/html/mapbender/http_auth

    <Directory /var/www/html/mapbender/http>
        Options +MultiViews +FollowSymLinks
        DirectoryIndex index.php index.html
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/mapbender/owsproxy>
        Options +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/mapbender/cors_proxy>
        Options +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/mapbender/http_auth>
        Options +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Mapbender writes session data and uploads here
    <Directory /var/www/html/mapbender/http/tmp>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/mapbender-error.log
    CustomLog ${APACHE_LOG_DIR}/mapbender-access.log combined
    LogLevel warn

    # Compression (matches Mapbender Install.txt recommendation)
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml
        AddOutputFilterByType DEFLATE text/css text/javascript application/javascript application/json
        AddOutputFilterByType DEFLATE image/svg+xml
    </IfModule>
</VirtualHost>
