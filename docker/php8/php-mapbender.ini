; PHP overrides for Mapbender 2.8 (PHP 8.2 target)
; Intentionally identical to the legacy 7.4 ini, so any behavior diff
; between containers must come from PHP itself, not from config.

; Match install.bash defaults: only log errors, don't display them.
; PHP 8 still records warnings to the log for debugging.
error_reporting = E_ERROR
display_errors = Off
log_errors = On
; Use Mapbender's own log/ dir — apache's /var/log/apache2 is root:adm 0750
; which www-data cannot traverse. Mapbender's entrypoint chowns log/ to www-data.
error_log = /var/www/html/mapbender/log/php-errors.log

memory_limit = 512M
max_execution_time = 180
max_input_time = 180
post_max_size = 64M
upload_max_filesize = 64M
default_socket_timeout = 120

date.timezone = Europe/Berlin
short_open_tag = On

session.save_handler = files
session.save_path = "/tmp"
session.gc_maxlifetime = 7200
session.cookie_lifetime = 0
session.use_strict_mode = 1

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
