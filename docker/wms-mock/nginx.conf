server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;

    # WMS GetCapabilities — return canned XML based on layer_id query
    location = /wms {
        if ($arg_REQUEST = "GetCapabilities") {
            rewrite ^.*$ /capabilities.xml break;
        }
        if ($arg_REQUEST = "GetMap") {
            rewrite ^.*$ /tile.png break;
        }
        if ($arg_REQUEST = "GetFeatureInfo") {
            rewrite ^.*$ /featureinfo.xml break;
        }
        try_files /unknown 404;
    }

    # WFS endpoint — canned XML responses
    location = /wfs {
        if ($arg_REQUEST = "GetCapabilities") {
            rewrite ^.*$ /wfs-capabilities.xml break;
        }
        try_files /unknown 404;
    }
    location = /wfs-capabilities.xml { default_type application/xml; }

    location = /capabilities.xml { default_type application/xml; }
    location = /featureinfo.xml { default_type application/xml; }
    location = /tile.png { default_type image/png; }

    # Health
    location = /healthz { return 200 "ok\n"; }
}
